name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: cargo fmt --check

  check:
    name: Clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang cmake pkg-config \
            libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libssl-dev libzstd-dev libasound2-dev libdbus-1-dev libvulkan-dev
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --features test-support --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Real service-worker integration
        run: scripts/test-service.sh
      - name: UI interaction and restart persistence
        run: scripts/test-ui.sh
      - name: Upload UI test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-diagnostics-${{ matrix.os }}
          path: target/ui-test-artifacts/
          if-no-files-found: ignore
      - name: Upload service test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-test-diagnostics-${{ matrix.os }}
          path: target/service-test-artifacts/
          if-no-files-found: ignore
