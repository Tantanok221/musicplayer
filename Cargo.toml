[package]
name = "sonora"
version = "0.1.0"
edition = "2024"
description = "An album-first Navidrome player for macOS"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
flume = "0.11"
gpui-kit = "=0.9.0"
md5 = "0.7"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
rodio = { version = "0.23", features = ["symphonia-mp3", "symphonia-flac"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
souvlaki = "0.8"
stream-download = "0.24"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync", "fs"] }
unicode-normalization = "0.1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
axum = "0.8"
hound = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "sonora"
path = "src/main.rs"
