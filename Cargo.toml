[package]
name = "sonora"
version = "0.1.0"
edition = "2024"
description = "An album-first Navidrome player for macOS and Linux"
license = "MIT"

[workspace]
members = ["crates/sonora-sync", "crates/sonora-sync-protocol"]
default-members = ["."]
resolver = "3"

[features]
# Controlled handles for application tests; never enabled by the local bundler.
test-support = []

[lints.clippy]
# Keep the default checks, and reject performance lint findings even without -D warnings.
perf = { level = "deny", priority = -1 }
redundant_clone = "deny"
large_futures = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
ed25519-dalek = "2.2"
flume = "0.11"
futures-util = "0.3"
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
gpui-kit = "=0.9.0"
md5 = "0.7"
if-addrs = "0.15"
mdns-sd = "0.18"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
rodio = { version = "0.23", features = ["symphonia-mp3", "symphonia-flac", "symphonia-alac", "symphonia-aiff"] }
rubato = { version = "0.16.2", default-features = false }
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.10"
sonora-sync-protocol = { path = "crates/sonora-sync-protocol" }
thiserror = "2"
souvlaki = "0.8"
stream-download = "0.24"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync", "fs"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
unicode-normalization = "0.1"
url = "2"
lofty = "0.25"
base64 = "0.22"
rusty-chromaprint = "0.3"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
# renamex_np, to exchange the installed and updated app bundles atomically.
libc = "0.2"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
hound = "3"
proptest = "1"

[profile.dev]
# Keep file/line backtraces without storing full variable and type debug data.
# The test profile inherits this setting.
debug = "line-tables-only"

[profile.release]
# Keep parallel compilation, but avoid a separate incremental release cache.
lto = "thin"
codegen-units = 16
incremental = false

[[bin]]
name = "sonora"
path = "src/main.rs"

[[test]]
name = "ui"
path = "tests/ui.rs"
required-features = ["test-support"]

[[test]]
name = "service_worker"
path = "tests/service_worker.rs"
required-features = ["test-support"]

[[test]]
name = "player_queue"
path = "tests/player_queue.rs"
required-features = ["test-support"]
